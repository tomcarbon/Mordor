<!-- State seal of the Black Land. Original work, hand-authored for WO-0001.1 by art-director.
     Copied from no source. Nine mirror-symmetric blades close on a plain ring around a sealed gate.
     Colour: the root color attribute is the <img> fallback. Inlined, CSS color overrides it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" color="#c8321a">
  <defs>
    <path id="blade" d="M0-104 26-172 12-196H-12L-26-172Z"/>
    <circle id="rivet" cy="-186" r="7"/>
  </defs>
  <g transform="translate(256 256)" fill="currentColor" stroke="none">
    <g fill="none" stroke="currentColor">
      <!-- 72 forged teeth: 2 * pi * 238 = 1495.398, / 144 = 10.3847.
           rotate(-2.5) centres a tooth on every blade and rivet axis, keeping the seal mirror-true. -->
      <circle r="238" stroke-width="24" stroke-dasharray="10.3847 10.3847" transform="rotate(-2.5)"/>
      <circle r="222" stroke-width="8"/>
      <circle r="204" stroke-width="3"/>
      <circle r="84" stroke-width="14"/>
    </g>
    <use href="#blade"/>
    <use href="#blade" transform="rotate(40)"/>
    <use href="#blade" transform="rotate(80)"/>
    <use href="#blade" transform="rotate(120)"/>
    <use href="#blade" transform="rotate(160)"/>
    <use href="#blade" transform="rotate(200)"/>
    <use href="#blade" transform="rotate(240)"/>
    <use href="#blade" transform="rotate(280)"/>
    <use href="#blade" transform="rotate(320)"/>
    <use href="#rivet" transform="rotate(20)"/>
    <use href="#rivet" transform="rotate(60)"/>
    <use href="#rivet" transform="rotate(100)"/>
    <use href="#rivet" transform="rotate(140)"/>
    <use href="#rivet" transform="rotate(180)"/>
    <use href="#rivet" transform="rotate(220)"/>
    <use href="#rivet" transform="rotate(260)"/>
    <use href="#rivet" transform="rotate(300)"/>
    <use href="#rivet" transform="rotate(340)"/>
    <path d="M0-60 19 0 0 60-19 0Z"/>
  </g>
</svg>
